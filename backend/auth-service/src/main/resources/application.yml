server:
  port: ${SERVER_PORT}

spring:
  application:
    name: AUTH-SERVICE
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

bank:
  feign:
    transaction-url: ${FEIGN_TRANSACTION_URL:}
  gateway:
    signing-secret: ${GATEWAY_SIGNING_SECRET}
    max-clock-skew-seconds: ${GATEWAY_MAX_CLOCK_SKEW_SECONDS}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-seconds: ${JWT_ACCESS_TTL}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL}
    mfa-ttl-seconds: ${JWT_MFA_TTL}
  aes:
    secret-key: ${AES_SECRET_KEY}
  security:
    login-max-failures: ${LOGIN_MAX_FAILURES}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES}
    # Server-only pepper for BoundPasswordEncoder (never store in DB)
    password-pepper: ${PASSWORD_PEPPER}
  admin:
    # Bootstrap seed from env — set seed-enabled=false after first staff created
    seed-enabled: ${ADMIN_SEED_ENABLED}
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    email: ${ADMIN_EMAIL}
  notification:
    internal-url: ${NOTIFICATION_INTERNAL_URL:http://bank-notification:8085}
    internal-api-key: ${NOTIFICATION_INTERNAL_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"
  level:
    com.banksystem.auth: INFO
