# Test-only config: shadows the main application.yml (which requires env vars for every setting).
# Datasource comes from Testcontainers via @ServiceConnection; Flyway migrates the container DB.
spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

mybatis:
  mapper-locations: classpath:mybatis/*.xml
  configuration:
    map-underscore-to-camel-case: true
