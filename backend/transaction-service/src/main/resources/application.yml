server:
  port: ${SERVER_PORT}

spring:
  application:
    name: TRANSACTION-SERVICE
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: ${KAFKA_PRODUCER_ACKS}
      properties:
        enable.idempotence: ${KAFKA_PRODUCER_IDEMPOTENCE}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: true

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: ${FEIGN_CONNECT_TIMEOUT_MS}
        readTimeout: ${FEIGN_READ_TIMEOUT_MS}

resilience4j:
  circuitbreaker:
    instances:
      ACCOUNT-SERVICE:
        slidingWindowSize: ${CIRCUIT_BREAKER_WINDOW_SIZE}
        failureRateThreshold: ${CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD}
        waitDurationInOpenState: ${CIRCUIT_BREAKER_OPEN_STATE_DURATION}
  retry:
    instances:
      ACCOUNT-SERVICE:
        maxAttempts: ${RETRY_MAX_ATTEMPTS}
        waitDuration: ${RETRY_WAIT_DURATION}

bank:
  gateway:
    signing-secret: ${GATEWAY_SIGNING_SECRET}
    max-clock-skew-seconds: ${GATEWAY_MAX_CLOCK_SKEW_SECONDS}
  internal:
    account-api-key: ${ACCOUNT_INTERNAL_API_KEY}
  saga:
    fail-credit: ${SAGA_FAIL_CREDIT}
  kafka:
    topic-completed: ${KAFKA_TOPIC_COMPLETED}
    topic-failed: ${KAFKA_TOPIC_FAILED}
  outbox:
    poll-ms: ${OUTBOX_POLL_MS}
    batch-size: ${OUTBOX_BATCH_SIZE}
    # Retry / dead-letter for unpublished events
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
    base-delay-ms: ${OUTBOX_BASE_DELAY_MS:1000}
    max-delay-ms: ${OUTBOX_MAX_DELAY_MS:300000}
  transfer:
    # Internal transfer limits (VND). Override via env when needed.
    max-per-transaction: ${TRANSFER_MAX_PER_TX:50000000}
    daily-limit: ${TRANSFER_DAILY_LIMIT:200000000}
    # Calendar day for daily limit (banking day). Default Vietnam.
    daily-limit-zone: ${TRANSFER_DAILY_LIMIT_ZONE:Asia/Bangkok}
    # Fee: fee = clamp(min, max, flat + amount * percent/100). Defaults free.
    # Source debited amount+fee; dest credited amount; fee credited to bank income account (GL).
    fee:
      enabled: ${TRANSFER_FEE_ENABLED:true}
      flat: ${TRANSFER_FEE_FLAT:0}
      percent: ${TRANSFER_FEE_PERCENT:0}
      min: ${TRANSFER_FEE_MIN:0}
      max: ${TRANSFER_FEE_MAX:50000}
      # Seeded in account-service V2__fee_income_account.sql (must match FEE_INCOME_ACCOUNT_NUMBER)
      # No hardcoded default: set TRANSFER_FEE_INCOME_ACCOUNT (or FEE_INCOME_ACCOUNT_NUMBER) in env.
      income-account-number: ${TRANSFER_FEE_INCOME_ACCOUNT:${FEE_INCOME_ACCOUNT_NUMBER:}}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.banksystem.transaction: INFO
