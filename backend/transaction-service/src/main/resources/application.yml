server:
  port: ${SERVER_PORT}

spring:
  application:
    name: TRANSACTION-SERVICE
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: ${KAFKA_PRODUCER_ACKS}
      properties:
        enable.idempotence: ${KAFKA_PRODUCER_IDEMPOTENCE}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: true

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: ${FEIGN_CONNECT_TIMEOUT_MS}
        readTimeout: ${FEIGN_READ_TIMEOUT_MS}

resilience4j:
  circuitbreaker:
    instances:
      ACCOUNT-SERVICE:
        slidingWindowSize: ${CIRCUIT_BREAKER_WINDOW_SIZE}
        failureRateThreshold: ${CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD}
        waitDurationInOpenState: ${CIRCUIT_BREAKER_OPEN_STATE_DURATION}
      NAPAS:
        slidingWindowSize: ${NAPAS_CIRCUIT_BREAKER_WINDOW_SIZE}
        minimumNumberOfCalls: ${NAPAS_CIRCUIT_BREAKER_MIN_CALLS}
        failureRateThreshold: ${NAPAS_CIRCUIT_BREAKER_FAILURE_RATE}
        waitDurationInOpenState: ${NAPAS_CIRCUIT_BREAKER_OPEN_DURATION}
      BENEFICIARY_INQUIRY:
        slidingWindowSize: ${INQUIRY_CIRCUIT_BREAKER_WINDOW_SIZE:10}
        minimumNumberOfCalls: ${INQUIRY_CIRCUIT_BREAKER_MIN_CALLS:5}
        failureRateThreshold: ${INQUIRY_CIRCUIT_BREAKER_FAILURE_RATE:50}
        waitDurationInOpenState: ${INQUIRY_CIRCUIT_BREAKER_OPEN_DURATION:5s}
  ratelimiter:
    instances:
      BENEFICIARY_INQUIRY:
        limitForPeriod: ${BANK_INQUIRY_RATE_LIMIT:10}
        limitRefreshPeriod: 1s
        timeoutDuration: 500ms
  retry:
    instances:
      ACCOUNT-SERVICE:
        maxAttempts: ${RETRY_MAX_ATTEMPTS}
        waitDuration: ${RETRY_WAIT_DURATION}
      NAPAS_READ:
        maxAttempts: ${NAPAS_READ_RETRY_MAX_ATTEMPTS}
        waitDuration: ${NAPAS_READ_RETRY_WAIT_DURATION}
        retryExceptions:
          - java.io.IOException
          - java.net.http.HttpTimeoutException
      BENEFICIARY_INQUIRY_RETRY:
        maxAttempts: ${INQUIRY_RETRY_MAX_ATTEMPTS:2}
        waitDuration: ${INQUIRY_RETRY_WAIT_DURATION:500ms}
        retryExceptions:
          - com.banksystem.transaction.application.transfer.BeneficiaryProviderException

bank:
  feign:
    notification-url: ${FEIGN_NOTIFICATION_URL}
    account-url: ${FEIGN_ACCOUNT_URL}
    auth-url: ${FEIGN_AUTH_URL}
  gateway:
    signing-secret: ${GATEWAY_SIGNING_SECRET}
    max-clock-skew-seconds: ${GATEWAY_MAX_CLOCK_SKEW_SECONDS}
  internal:
    # Own key: callers (e.g. account-service audit push) must present this.
    api-key: ${TRANSACTION_INTERNAL_API_KEY}
    account-api-key: ${ACCOUNT_INTERNAL_API_KEY}
    auth-api-key: ${AUTH_INTERNAL_API_KEY}
    notification-api-key: ${NOTIFICATION_INTERNAL_API_KEY}
  aes:
    secret-key: ${AES_SECRET_KEY}
  merchant:
    platform-commission-account-id: ${PLATFORM_COMMISSION_ACCOUNT_ID}
    default-bank-bin: ${VA_DEFAULT_BANK_BIN:970422}
  beneficiary:
    # Redis TTL for GET /transactions/beneficiaries (seconds). Set in infra/.env.
    cache-ttl-seconds: ${BENEFICIARY_CACHE_TTL_SECONDS}
  kafka:
    topic-completed: ${KAFKA_TOPIC_COMPLETED}
    topic-failed: ${KAFKA_TOPIC_FAILED}
  outbox:
    poll-ms: ${OUTBOX_POLL_MS}
    batch-size: ${OUTBOX_BATCH_SIZE}
    claim-lease-seconds: ${OUTBOX_CLAIM_LEASE_SECONDS}
    # Retry / dead-letter for unpublished events
    max-attempts: ${OUTBOX_MAX_ATTEMPTS}
    base-delay-ms: ${OUTBOX_BASE_DELAY_MS}
    max-delay-ms: ${OUTBOX_MAX_DELAY_MS}
  # End-of-day ledger reconciliation (transfer_orders vs account-service ledger).
  # Scheduled run is opt-in; manual runs via POST /api/v1/admin/recon/runs always work.
  recon:
    enabled: ${RECON_ENABLED}
    # Default 00:30 banking-day zone, reconciling the previous banking day.
    cron: ${RECON_CRON}
  # mock (default) | http — real switch URL/key only via env
  napas:
    provider: ${NAPAS_PROVIDER:mock}
    base-url: ${NAPAS_BASE_URL}
    api-key: ${NAPAS_API_KEY}
    webhook-secret: ${NAPAS_WEBHOOK_SECRET}
    webhook-max-clock-skew-seconds: ${NAPAS_WEBHOOK_MAX_CLOCK_SKEW_SECONDS}
    connect-timeout-ms: ${NAPAS_CONNECT_TIMEOUT_MS}
    request-timeout-ms: ${NAPAS_REQUEST_TIMEOUT_MS}
    status:
      poll-ms: ${NAPAS_STATUS_POLL_MS}
      min-age-seconds: ${NAPAS_STATUS_MIN_AGE_SECONDS}
      max-attempts: ${NAPAS_STATUS_MAX_ATTEMPTS}
  transfer:
    # Internal transfer limits (VND). Override via env when needed.
    max-per-transaction: ${TRANSFER_MAX_PER_TX}
    daily-limit: ${TRANSFER_DAILY_LIMIT}
    # Calendar day for daily limit (banking day). Default Vietnam.
    daily-limit-zone: ${TRANSFER_DAILY_LIMIT_ZONE}
    # Fee: fee = clamp(min, max, flat + amount * percent/100). Defaults free.
    # Source debited amount+fee; dest credited amount; fee credited to bank income account (GL).
    fee:
      enabled: ${TRANSFER_FEE_ENABLED}
      flat: ${TRANSFER_FEE_FLAT}
      percent: ${TRANSFER_FEE_PERCENT}
      min: ${TRANSFER_FEE_MIN}
      max: ${TRANSFER_FEE_MAX}
      # Seeded in account-service V2__fee_income_account.sql (must match FEE_INCOME_ACCOUNT_NUMBER).
      # Value only from env (infra/.env) — no default in this pushed file.
      income-account-number: ${TRANSFER_FEE_INCOME_ACCOUNT}
  sepay:
    enabled: ${SEPAY_ENABLED:false}
    api-key: ${SEPAY_API_KEY}
    account-number: ${SEPAY_BANK_ACCOUNT}
    bank-name: ${SEPAY_BANK_NAME}
    account-name: ${SEPAY_ACCOUNT_NAME}
    qr-template: ${SEPAY_QR_TEMPLATE}
    order-expiry-minutes: ${SEPAY_ORDER_EXPIRY_MINUTES}
    webhook-secret: ${SEPAY_WEBHOOK_SECRET}
  va:
    mock-enabled: ${MOCK_VA_ENABLED:false}
    mock-sandbox-key: ${MOCK_VA_SANDBOX_KEY:}
    default-bank-bin: ${VA_DEFAULT_BANK_BIN:970422}
    default-provider: ${VA_DEFAULT_PROVIDER:MOCK}
  payout:
    seller-payable-account-code: ${PAYOUT_SELLER_PAYABLE_ACCOUNT_CODE:GL:2110_SELLER_PAYABLE}
    clearing-account-code: ${PAYOUT_CLEARING_ACCOUNT_CODE:CLEARING:NAPAS_PAYOUT}
  inquiry:
    # mock (default) | external
    provider: ${BANK_INQUIRY_PROVIDER}
    ttl: ${BANK_INQUIRY_TTL}
    external:
      base-url: ${BANK_INQUIRY_EXTERNAL_BASE_URL}
      client-id: ${BANK_INQUIRY_EXTERNAL_CLIENT_ID}
      api-key: ${BANK_INQUIRY_EXTERNAL_API_KEY}
      timeout-ms: ${BANK_INQUIRY_TIMEOUT_MS}
  directory:
    sync:
      url: ${BANK_DIRECTORY_SYNC_URL}
      cron: ${BANK_DIRECTORY_SYNC_CRON}
  security:
    aes-key: ${BANK_ENCRYPTION_AES_KEY}
    hmac-key: ${BANK_ENCRYPTION_HMAC_KEY}
  sandbox:
    topup:
      enabled: ${BANK_SANDBOX_TOPUP_ENABLED}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

mybatis:
  mapper-locations: classpath:mybatis/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%magenta(${spring.application.name:system-bank})] [%thread] %highlight(%-5level) [%cyan(%X{correlationId:-})][%blue(%X{userId:-})] [%yellow(%-35logger{35})] : %msg%n"
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{userId:-}]"
  level:
    root: INFO
    com.banksystem: INFO
    org.springframework.web: INFO
