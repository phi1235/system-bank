server:
  port: ${SERVER_PORT}

spring:
  application:
    name: NOTIFICATION-SERVICE
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: ${KAFKA_ENABLE_AUTO_COMMIT}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH}
          starttls:
            enable: ${SMTP_STARTTLS}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: true

bank:
  gateway:
    signing-secret: ${GATEWAY_SIGNING_SECRET}
    max-clock-skew-seconds: ${GATEWAY_MAX_CLOCK_SKEW_SECONDS}
  kafka:
    topic-completed: ${KAFKA_TOPIC_COMPLETED}
    topic-failed: ${KAFKA_TOPIC_FAILED}
  internal:
    api-key: ${NOTIFICATION_INTERNAL_API_KEY}
  notification:
    ops-recipient: ${OPS_NOTIFICATION_RECIPIENT}
    delivery-cron: ${NOTIFICATION_DELIVERY_CRON}
    delivery-batch-size: ${NOTIFICATION_DELIVERY_BATCH_SIZE}
    delivery-max-attempts: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS}
    delivery-initial-backoff: ${NOTIFICATION_DELIVERY_INITIAL_BACKOFF}
    sse-timeout: ${NOTIFICATION_SSE_TIMEOUT}
  # mock (default) | smtp — real credentials only via env / infra/.env
  email:
    provider: ${EMAIL_PROVIDER}
    from: ${EMAIL_FROM}
  # mock (default) | http — real SMS gateway URL/key only via env
  sms:
    provider: ${SMS_PROVIDER}
    base-url: ${SMS_BASE_URL}
    api-key: ${SMS_API_KEY}
    from: ${SMS_FROM}
    connect-timeout: ${SMS_CONNECT_TIMEOUT}
    read-timeout: ${SMS_READ_TIMEOUT}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    # Avoid probing SMTP when EMAIL_PROVIDER=mock / SMTP credentials unset.
    mail:
      enabled: ${MAIL_HEALTH_ENABLED}

  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%magenta(${spring.application.name:system-bank})] [%thread] %highlight(%-5level) [%cyan(%X{correlationId:-})][%blue(%X{userId:-})] [%yellow(%-35logger{35})] : %msg%n"
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{userId:-}]"
  level:
    root: INFO
    com.banksystem: INFO
    org.springframework.web: INFO
