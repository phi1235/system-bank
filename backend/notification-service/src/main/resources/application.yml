server:
  port: ${SERVER_PORT}

spring:
  application:
    name: NOTIFICATION-SERVICE
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: ${KAFKA_ENABLE_AUTO_COMMIT}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: true

bank:
  gateway:
    signing-secret: ${GATEWAY_SIGNING_SECRET}
    max-clock-skew-seconds: ${GATEWAY_MAX_CLOCK_SKEW_SECONDS}
  kafka:
    topic-completed: ${KAFKA_TOPIC_COMPLETED}
    topic-failed: ${KAFKA_TOPIC_FAILED}
  internal:
    api-key: ${NOTIFICATION_INTERNAL_API_KEY}
  # mock (default) | smtp — real credentials only via env / infra/.env
  email:
    provider: ${EMAIL_PROVIDER:mock}
    from: ${EMAIL_FROM:}
  # mock (default) | http — real SMS gateway URL/key only via env
  sms:
    provider: ${SMS_PROVIDER:mock}
    base-url: ${SMS_BASE_URL:}
    api-key: ${SMS_API_KEY:}
    from: ${SMS_FROM:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    # Avoid probing SMTP when EMAIL_PROVIDER=mock / SMTP credentials unset.
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"
  level:
    com.banksystem.notification: INFO
