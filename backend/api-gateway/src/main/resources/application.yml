server:
  port: ${SERVER_PORT}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
        - id: customer-service
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/customers/**
        - id: account-service
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/v1/accounts/**,/api/v1/deposits/**,/api/v1/cards/**
        - id: transaction-service
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/v1/transactions/**,/api/v1/banks,/api/v1/bills/**,/api/v1/payments/**
        - id: napas-callback
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/v1/callbacks/napas/**
        - id: sepay-routes
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/v1/payments/sepay/**
        # SSE first (more specific) so /** does not swallow the stream path.
        # response-timeout: 0 aborts JSON bodies as empty 200 — use a long positive ms for SSE only.
        - id: notification-service-stream
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications/stream
          metadata:
            response-timeout: ${NOTIFICATION_SSE_RESPONSE_TIMEOUT_MS}
        - id: admin-routes-notifications-stream
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/admin/notifications/stream
          metadata:
            response-timeout: ${NOTIFICATION_SSE_RESPONSE_TIMEOUT_MS}
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications,/api/v1/notifications/**
        - id: admin-routes-notifications
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/admin/notifications,/api/v1/admin/notifications/**
        - id: dev-sandbox-notifications
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/dev/notifications/sandbox
        - id: admin-routes-rbac
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/admin/rbac/**
        - id: admin-routes-password-reset
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/admin/password-reset/**,/api/v1/admin/users/**
        - id: admin-routes-dashboard
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/admin/dashboard,/api/v1/admin/dashboard/**
        - id: admin-routes-customers
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/admin/customers,/api/v1/admin/customers/**
        - id: admin-routes-kyc
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/admin/kyc/**
        - id: admin-routes-support-tickets
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/admin/support-tickets,/api/v1/admin/support-tickets/**
        - id: admin-routes-accounts
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/v1/admin/accounts,/api/v1/admin/accounts/**
        - id: admin-routes-deposits
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/v1/admin/deposits,/api/v1/admin/deposits/**
        - id: admin-routes-cards
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/v1/admin/cards,/api/v1/admin/cards/**
        - id: admin-routes-transactions
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/v1/admin/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

bank:
  gateway:
    signing-secret: ${GATEWAY_SIGNING_SECRET}
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  rate-limit:
    login:
      limit: ${RATE_LIMIT_LOGIN}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS}
    global:
      enabled: ${RATE_LIMIT_GLOBAL_ENABLED}
      limit: ${RATE_LIMIT_GLOBAL}
      window-seconds: ${RATE_LIMIT_GLOBAL_WINDOW_SECONDS}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%magenta(${spring.application.name:system-bank})] [%thread] %highlight(%-5level) [%cyan(%X{correlationId:-})][%blue(%X{userId:-})] [%yellow(%-35logger{35})] : %msg%n"
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{userId:-}]"
  level:
    root: INFO
    com.banksystem: INFO
    org.springframework.cloud.gateway: INFO
