server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
        - id: customer-service
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/customers/**
        - id: account-service
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/v1/accounts/**
        - id: transaction-service
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/v1/transactions/**
        - id: admin-routes-rbac
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/admin/rbac/**
        - id: admin-routes-password-reset
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/admin/password-reset/**,/api/v1/admin/users/**
        - id: admin-routes-customers
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/admin/customers/**
        - id: admin-routes-accounts
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/v1/admin/accounts/**
        - id: admin-routes-transactions
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/v1/admin/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

bank:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:5173}
  rate-limit:
    login:
      limit: ${RATE_LIMIT_LOGIN:5}
      window-seconds: 60
    global:
      enabled: ${RATE_LIMIT_GLOBAL_ENABLED:true}
      limit: ${RATE_LIMIT_GLOBAL:100}
      window-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    org.springframework.cloud.gateway: INFO
