server:
  port: ${SERVER_PORT}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
        - id: customer-service
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/customers/**
        - id: account-service
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/v1/accounts/**
        - id: transaction-service
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/v1/transactions/**
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications/**
          # SSE stream stays open; avoid default response timeout cutting the pipe.
          metadata:
            response-timeout: 0
        - id: admin-routes-rbac
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/admin/rbac/**
        - id: admin-routes-password-reset
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/admin/password-reset/**,/api/v1/admin/users/**
        - id: admin-routes-customers
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/admin/customers/**
        - id: admin-routes-accounts
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/v1/admin/accounts/**
        - id: admin-routes-transactions
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/v1/admin/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

bank:
  gateway:
    signing-secret: ${GATEWAY_SIGNING_SECRET}
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  rate-limit:
    login:
      limit: ${RATE_LIMIT_LOGIN}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS}
    global:
      enabled: ${RATE_LIMIT_GLOBAL_ENABLED}
      limit: ${RATE_LIMIT_GLOBAL}
      window-seconds: ${RATE_LIMIT_GLOBAL_WINDOW_SECONDS}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    org.springframework.cloud.gateway: INFO
