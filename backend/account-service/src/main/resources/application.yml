server:
  port: ${SERVER_PORT}

spring:
  application:
    name: ACCOUNT-SERVICE
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: true

bank:
  account:
    max-per-user: ${ACCOUNT_MAX_PER_USER}
    initial-balance: ${ACCOUNT_INITIAL_BALANCE}
  gateway:
    signing-secret: ${GATEWAY_SIGNING_SECRET}
    max-clock-skew-seconds: ${GATEWAY_MAX_CLOCK_SKEW_SECONDS}
  internal:
    api-key: ${ACCOUNT_INTERNAL_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
