server:
  port: ${SERVER_PORT}

spring:
  application:
    name: ACCOUNT-SERVICE
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    placeholders:
      # Bootstrap IDs for internal fee-income GL account and system user.
      # Values come ONLY from env (infra/.env). No defaults in this pushed file.
      # Must match TRANSFER_FEE_INCOME_ACCOUNT used by transaction-service.
      fee-income-id: ${FEE_INCOME_ACCOUNT_ID}
      system-user-id: ${SYSTEM_INTERNAL_USER_ID}
      fee-income-number: ${FEE_INCOME_ACCOUNT_NUMBER}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: true

bank:
  feign:
    notification-url: ${FEIGN_NOTIFICATION_URL:}
    customer-url: ${FEIGN_CUSTOMER_URL:}
    transaction-url: ${FEIGN_TRANSACTION_URL:}
  account:
    max-per-user: ${ACCOUNT_MAX_PER_USER}
    initial-balance: ${ACCOUNT_INITIAL_BALANCE}
    topup:
      max-amount: 50000000
  aes:
    # PAN-at-rest encryption (same key material as customer PII).
    secret-key: ${AES_SECRET_KEY}
  card:
    default-daily-limit: ${CARD_DEFAULT_DAILY_LIMIT:20000000}
    max-daily-limit: ${CARD_MAX_DAILY_LIMIT:100000000}
    validity-years: ${CARD_VALIDITY_YEARS:3}
  deposit:
    # Banking-day zone for maturity dates and interest day counts.
    zone: ${DEPOSIT_ZONE:Asia/Bangkok}
    # Nightly accrual + maturity batch; opt-in. Manual runs via admin API always work.
    batch:
      enabled: ${DEPOSIT_BATCH_ENABLED:false}
      cron: ${DEPOSIT_BATCH_CRON:0 15 0 * * *}
  gateway:
    signing-secret: ${GATEWAY_SIGNING_SECRET}
    max-clock-skew-seconds: ${GATEWAY_MAX_CLOCK_SKEW_SECONDS}
  internal:
    api-key: ${ACCOUNT_INTERNAL_API_KEY}
    notification-api-key: ${NOTIFICATION_INTERNAL_API_KEY}
    # Keys presented when calling other services (key identifies the target).
    transaction-api-key: ${TRANSACTION_INTERNAL_API_KEY}
    customer-api-key: ${CUSTOMER_INTERNAL_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

mybatis:
  mapper-locations: classpath:mybatis/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"
