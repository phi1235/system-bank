# Test-only config: shadows the main application.yml (which requires env vars for every setting).
# Datasource comes from Testcontainers via @ServiceConnection; Flyway migrates the container DB.
spring:
  flyway:
    enabled: true
    placeholders:
      # V2__fee_income_account.sql bootstrap seed (any valid values work for tests).
      fee-income-id: 00000000-0000-0000-0000-00000000fee1
      system-user-id: 00000000-0000-0000-0000-0000000005e5
      fee-income-number: "9999000001"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
