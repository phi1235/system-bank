server:
  port: ${SERVER_PORT}

spring:
  application:
    name: CUSTOMER-SERVICE
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${KYC_MULTIPART_MAX_FILE_SIZE}
      max-request-size: ${KYC_MULTIPART_MAX_REQUEST_SIZE}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: true

bank:
  feign:
    account-url: ${FEIGN_ACCOUNT_URL}
    transaction-url: ${FEIGN_TRANSACTION_URL}
    auth-url: ${FEIGN_AUTH_URL}
    notification-url: ${FEIGN_NOTIFICATION_URL}
  aes:
    secret-key: ${AES_SECRET_KEY}
  gateway:
    signing-secret: ${GATEWAY_SIGNING_SECRET}
    max-clock-skew-seconds: ${GATEWAY_MAX_CLOCK_SKEW_SECONDS}
  internal:
    api-key: ${CUSTOMER_INTERNAL_API_KEY}
    account-api-key: ${ACCOUNT_INTERNAL_API_KEY}
    transaction-api-key: ${TRANSACTION_INTERNAL_API_KEY}
    user-api-key: ${AUTH_INTERNAL_API_KEY}
    notification-api-key: ${NOTIFICATION_INTERNAL_API_KEY}
  kyc:
    max-file-bytes: ${KYC_MAX_FILE_BYTES}
    storage:
      endpoint: ${KYC_STORAGE_ENDPOINT}
      access-key: ${KYC_STORAGE_ACCESS_KEY}
      secret-key: ${KYC_STORAGE_SECRET_KEY}
      bucket: ${KYC_STORAGE_BUCKET}
    antivirus:
      host: ${KYC_ANTIVIRUS_HOST}
      port: ${KYC_ANTIVIRUS_PORT}
      connect-timeout-ms: ${KYC_ANTIVIRUS_CONNECT_TIMEOUT_MS}
      read-timeout-ms: ${KYC_ANTIVIRUS_READ_TIMEOUT_MS}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%magenta(${spring.application.name:system-bank})] [%thread] %highlight(%-5level) [%cyan(%X{correlationId:-})][%blue(%X{userId:-})] [%yellow(%-35logger{35})] : %msg%n"
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{userId:-}]"
  level:
    root: INFO
    com.banksystem: INFO
    org.springframework.web: INFO
