<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p class="msg">{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">
    {{ data.cancelText || data.cancelLabel || ('COMMON.CANCEL' | translate) }}
  </button>
  <button
    mat-flat-button
    type="button"
    [color]="(data.destructive || data.danger) ? 'warn' : 'primary'"
    [mat-dialog-close]="true"
  >
    {{ data.confirmText || data.confirmLabel || ('COMMON.OK' | translate) }}
  </button>
</mat-dialog-actions>
