# Bank System — Phase 1 stack
# Usage: docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
# (run from repo root)

name: bank-system

services:
  postgres:
    image: postgres:16-alpine
    container_name: bank-postgres
    command: postgres -c max_connections=150
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env}
      POSTGRES_DB: ${POSTGRES_DEFAULT_DB}
    ports:
      # Host 5433 to avoid clash with local Postgres on 5432
      - "${HOST_BIND_ADDRESS}:${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bank-net

  redis:
    image: redis:7-alpine
    container_name: bank-redis
    ports:
      - "${HOST_BIND_ADDRESS}:${REDIS_HOST_PORT}:${REDIS_CONTAINER_PORT}"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - bank-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: bank-minio
    command: server /data --console-address ":${MINIO_CONSOLE_CONTAINER_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${HOST_BIND_ADDRESS}:${MINIO_HOST_PORT}:${MINIO_CONTAINER_PORT}"
      - "${HOST_BIND_ADDRESS}:${MINIO_CONSOLE_HOST_PORT}:${MINIO_CONSOLE_CONTAINER_PORT}"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - bank-net

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: bank-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set bank http://bank-minio:${MINIO_CONTAINER_PORT} "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing bank/${CORPORATE_STORAGE_BUCKET:-bank-corporate}
    restart: "no"
    networks:
      - bank-net

  clamav:
    image: clamav/clamav:1.4.3
    container_name: bank-clamav
    ports:
      - "${HOST_BIND_ADDRESS}:${CLAMAV_HOST_PORT}:${KYC_ANTIVIRUS_PORT}"
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - bank-net

  kafka:
    image: apache/kafka:3.8.0
    container_name: bank-kafka
    ports:
      - "${HOST_BIND_ADDRESS}:${KAFKA_HOST_PORT}:${KAFKA_BROKER_PORT}"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:${KAFKA_BROKER_PORT},CONTROLLER://:${KAFKA_CONTROLLER_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_BROKER_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:${KAFKA_CONTROLLER_PORT}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_MIN_ISR}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID must be set in infra/.env}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:${KAFKA_BROKER_PORT} --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks:
      - bank-net

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: bank-zipkin
    ports:
      - "${HOST_BIND_ADDRESS}:${ZIPKIN_HOST_PORT}:${ZIPKIN_CONTAINER_PORT}"
    networks:
      - bank-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: bank-prometheus
    ports:
      - "${HOST_BIND_ADDRESS}:${PROMETHEUS_HOST_PORT}:${PROMETHEUS_CONTAINER_PORT}"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - bank-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: bank-grafana
    ports:
      - "${HOST_BIND_ADDRESS}:${GRAFANA_HOST_PORT}:${GRAFANA_CONTAINER_PORT}"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in infra/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - bank-net

  discovery-server:
    build:
      context: ../backend
      dockerfile: discovery-server/Dockerfile
    container_name: bank-discovery
    environment:
      SERVER_PORT: ${DISCOVERY_SERVICE_PORT}
      EUREKA_INSTANCE_HOSTNAME: ${EUREKA_INSTANCE_HOSTNAME}
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT}
      EUREKA_SELF_PRESERVATION: ${EUREKA_SELF_PRESERVATION}
      EUREKA_EVICTION_INTERVAL_MS: ${EUREKA_EVICTION_INTERVAL_MS}
      TRACING_SAMPLE_PROBABILITY: ${TRACING_SAMPLE_PROBABILITY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${DISCOVERY_SERVICE_PORT}/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - bank-net

  auth-service:
    build:
      context: ../backend
      dockerfile: auth-service/Dockerfile
    container_name: bank-auth
    environment:
      SERVER_PORT: ${AUTH_SERVICE_PORT}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_CONTAINER_PORT}
      DB_NAME: ${AUTH_DB_NAME}

      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_CONTAINER_PORT}
      EUREKA_URL: ${EUREKA_URL}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in infra/.env}
      AES_SECRET_KEY: ${AES_SECRET_KEY:?AES_SECRET_KEY must be set in infra/.env}
      GATEWAY_SIGNING_SECRET: ${GATEWAY_SIGNING_SECRET:?GATEWAY_SIGNING_SECRET must be set in infra/.env}
      GATEWAY_MAX_CLOCK_SKEW_SECONDS: ${GATEWAY_MAX_CLOCK_SKEW_SECONDS}
      TRACING_SAMPLE_PROBABILITY: ${TRACING_SAMPLE_PROBABILITY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in infra/.env}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER must be set in infra/.env}
      AUTH_INTERNAL_API_KEY: ${AUTH_INTERNAL_API_KEY:?AUTH_INTERNAL_API_KEY must be set in infra/.env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      JWT_MFA_TTL: ${JWT_MFA_TTL}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES}
      NOTIFICATION_INTERNAL_API_KEY: ${NOTIFICATION_INTERNAL_API_KEY:?NOTIFICATION_INTERNAL_API_KEY must be set in infra/.env}
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${AUTH_SERVICE_PORT}/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - bank-net

  customer-service:
    build:
      context: ../backend
      dockerfile: customer-service/Dockerfile
    container_name: bank-customer
    environment:
      SERVER_PORT: ${CUSTOMER_SERVICE_PORT}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_CONTAINER_PORT}
      DB_NAME: ${CUSTOMER_DB_NAME}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env}
      EUREKA_URL: ${EUREKA_URL}
      AES_SECRET_KEY: ${AES_SECRET_KEY:?AES_SECRET_KEY must be set in infra/.env}
      AUTH_INTERNAL_API_KEY: ${AUTH_INTERNAL_API_KEY:?AUTH_INTERNAL_API_KEY must be set in infra/.env}
      ACCOUNT_INTERNAL_API_KEY: ${ACCOUNT_INTERNAL_API_KEY:?ACCOUNT_INTERNAL_API_KEY must be set in infra/.env}
      CUSTOMER_INTERNAL_API_KEY: ${CUSTOMER_INTERNAL_API_KEY:?CUSTOMER_INTERNAL_API_KEY must be set in infra/.env}
      TRANSACTION_INTERNAL_API_KEY: ${TRANSACTION_INTERNAL_API_KEY:?TRANSACTION_INTERNAL_API_KEY must be set in infra/.env}
      NOTIFICATION_INTERNAL_API_KEY: ${NOTIFICATION_INTERNAL_API_KEY:?NOTIFICATION_INTERNAL_API_KEY must be set in infra/.env}
      GATEWAY_MAX_CLOCK_SKEW_SECONDS: ${GATEWAY_MAX_CLOCK_SKEW_SECONDS}
      TRACING_SAMPLE_PROBABILITY: ${TRACING_SAMPLE_PROBABILITY}
      GATEWAY_SIGNING_SECRET: ${GATEWAY_SIGNING_SECRET:?GATEWAY_SIGNING_SECRET must be set in infra/.env}
      KYC_STORAGE_ENDPOINT: ${KYC_STORAGE_ENDPOINT}
      KYC_STORAGE_ACCESS_KEY: ${KYC_STORAGE_ACCESS_KEY}
      KYC_STORAGE_SECRET_KEY: ${KYC_STORAGE_SECRET_KEY}
      KYC_STORAGE_BUCKET: ${KYC_STORAGE_BUCKET}
      KYC_MAX_FILE_BYTES: ${KYC_MAX_FILE_BYTES}
      KYC_MULTIPART_MAX_FILE_SIZE: ${KYC_MULTIPART_MAX_FILE_SIZE}
      KYC_MULTIPART_MAX_REQUEST_SIZE: ${KYC_MULTIPART_MAX_REQUEST_SIZE}
      KYC_ANTIVIRUS_HOST: ${KYC_ANTIVIRUS_HOST}
      KYC_ANTIVIRUS_PORT: ${KYC_ANTIVIRUS_PORT}
      KYC_ANTIVIRUS_CONNECT_TIMEOUT_MS: ${KYC_ANTIVIRUS_CONNECT_TIMEOUT_MS}
      KYC_ANTIVIRUS_READ_TIMEOUT_MS: ${KYC_ANTIVIRUS_READ_TIMEOUT_MS}
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${CUSTOMER_SERVICE_PORT}/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - bank-net

  account-service:
    build:
      context: ../backend
      dockerfile: account-service/Dockerfile
    container_name: bank-account
    environment:
      SERVER_PORT: ${ACCOUNT_SERVICE_PORT}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_CONTAINER_PORT}
      DB_NAME: ${ACCOUNT_DB_NAME}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_CONTAINER_PORT}
      EUREKA_URL: ${EUREKA_URL}
      GATEWAY_MAX_CLOCK_SKEW_SECONDS: ${GATEWAY_MAX_CLOCK_SKEW_SECONDS}
      TRACING_SAMPLE_PROBABILITY: ${TRACING_SAMPLE_PROBABILITY}
      ACCOUNT_INTERNAL_API_KEY: ${ACCOUNT_INTERNAL_API_KEY:?ACCOUNT_INTERNAL_API_KEY must be set in infra/.env}
      NOTIFICATION_INTERNAL_API_KEY: ${NOTIFICATION_INTERNAL_API_KEY:?NOTIFICATION_INTERNAL_API_KEY must be set in infra/.env}
      TRANSACTION_INTERNAL_API_KEY: ${TRANSACTION_INTERNAL_API_KEY:?TRANSACTION_INTERNAL_API_KEY must be set in infra/.env}
      CUSTOMER_INTERNAL_API_KEY: ${CUSTOMER_INTERNAL_API_KEY:?CUSTOMER_INTERNAL_API_KEY must be set in infra/.env}
      GATEWAY_SIGNING_SECRET: ${GATEWAY_SIGNING_SECRET:?GATEWAY_SIGNING_SECRET must be set in infra/.env}
      # Card PAN encryption at rest
      AES_SECRET_KEY: ${AES_SECRET_KEY:?AES_SECRET_KEY must be set in infra/.env}
      ACCOUNT_MAX_PER_USER: ${ACCOUNT_MAX_PER_USER}
      ACCOUNT_INITIAL_BALANCE: ${ACCOUNT_INITIAL_BALANCE}
      # Term-deposit nightly batch: opt-in; manual admin runs always work.
      DEPOSIT_BATCH_ENABLED: ${DEPOSIT_BATCH_ENABLED}
      DEPOSIT_BATCH_CRON: ${DEPOSIT_BATCH_CRON}
      LEDGER_SNAPSHOT_ENABLED: ${LEDGER_SNAPSHOT_ENABLED}
      LEDGER_SNAPSHOT_BATCH_SIZE: ${LEDGER_SNAPSHOT_BATCH_SIZE}
      LEDGER_SNAPSHOT_CRON: ${LEDGER_SNAPSHOT_CRON}
      LEDGER_BACKFILL_ENABLED: ${LEDGER_BACKFILL_ENABLED}
      LEDGER_BACKFILL_BATCH_SIZE: ${LEDGER_BACKFILL_BATCH_SIZE}
      LEDGER_BACKFILL_CRON: ${LEDGER_BACKFILL_CRON}
      LEDGER_HOLD_EXPIRY_BATCH_SIZE: ${LEDGER_HOLD_EXPIRY_BATCH_SIZE}
      LEDGER_HOLD_EXPIRY_CRON: ${LEDGER_HOLD_EXPIRY_CRON}
      # Flyway placeholders for fee-income GL seed (V2__fee_income_account.sql)
      # Values only from infra/.env — no defaults in this pushed file.
      FEE_INCOME_ACCOUNT_ID: ${FEE_INCOME_ACCOUNT_ID:?FEE_INCOME_ACCOUNT_ID must be set in infra/.env}
      SYSTEM_INTERNAL_USER_ID: ${SYSTEM_INTERNAL_USER_ID:?SYSTEM_INTERNAL_USER_ID must be set in infra/.env}
      FEE_INCOME_ACCOUNT_NUMBER: ${FEE_INCOME_ACCOUNT_NUMBER:?FEE_INCOME_ACCOUNT_NUMBER must be set in infra/.env}
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${ACCOUNT_SERVICE_PORT}/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - bank-net


  transaction-service:
    build:
      context: ../backend
      dockerfile: transaction-service/Dockerfile
    container_name: bank-transaction
    environment:
      SERVER_PORT: ${TRANSACTION_SERVICE_PORT}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_CONTAINER_PORT}
      DB_NAME: ${TRANSACTION_DB_NAME}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env}
      EUREKA_URL: ${EUREKA_URL}
      GATEWAY_MAX_CLOCK_SKEW_SECONDS: ${GATEWAY_MAX_CLOCK_SKEW_SECONDS}
      TRACING_SAMPLE_PROBABILITY: ${TRACING_SAMPLE_PROBABILITY}
      KAFKA_PRODUCER_ACKS: ${KAFKA_PRODUCER_ACKS}
      KAFKA_PRODUCER_IDEMPOTENCE: ${KAFKA_PRODUCER_IDEMPOTENCE}
      KAFKA_TOPIC_COMPLETED: ${KAFKA_TOPIC_COMPLETED}
      KAFKA_TOPIC_FAILED: ${KAFKA_TOPIC_FAILED}
      OPS_NOTIFICATION_RECIPIENT: ${OPS_NOTIFICATION_RECIPIENT}
      NOTIFICATION_DELIVERY_CRON: ${NOTIFICATION_DELIVERY_CRON}
      NOTIFICATION_DELIVERY_BATCH_SIZE: ${NOTIFICATION_DELIVERY_BATCH_SIZE}
      NOTIFICATION_DELIVERY_MAX_ATTEMPTS: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS}
      NOTIFICATION_DELIVERY_INITIAL_BACKOFF: ${NOTIFICATION_DELIVERY_INITIAL_BACKOFF}
      NOTIFICATION_SSE_TIMEOUT: ${NOTIFICATION_SSE_TIMEOUT}
      FEIGN_CONNECT_TIMEOUT_MS: ${FEIGN_CONNECT_TIMEOUT_MS}
      FEIGN_READ_TIMEOUT_MS: ${FEIGN_READ_TIMEOUT_MS}
      CIRCUIT_BREAKER_WINDOW_SIZE: ${CIRCUIT_BREAKER_WINDOW_SIZE}
      CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD}
      CIRCUIT_BREAKER_OPEN_STATE_DURATION: ${CIRCUIT_BREAKER_OPEN_STATE_DURATION}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS}
      RETRY_WAIT_DURATION: ${RETRY_WAIT_DURATION}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS}
      OUTBOX_BASE_DELAY_MS: ${OUTBOX_BASE_DELAY_MS}
      OUTBOX_MAX_DELAY_MS: ${OUTBOX_MAX_DELAY_MS}
      OUTBOX_CLAIM_LEASE_SECONDS: ${OUTBOX_CLAIM_LEASE_SECONDS}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      ACCOUNT_INTERNAL_API_KEY: ${ACCOUNT_INTERNAL_API_KEY:?ACCOUNT_INTERNAL_API_KEY must be set in infra/.env}
      NOTIFICATION_INTERNAL_API_KEY: ${NOTIFICATION_INTERNAL_API_KEY:?NOTIFICATION_INTERNAL_API_KEY must be set in infra/.env}
      TRANSACTION_INTERNAL_API_KEY: ${TRANSACTION_INTERNAL_API_KEY:?TRANSACTION_INTERNAL_API_KEY must be set in infra/.env}
      GATEWAY_SIGNING_SECRET: ${GATEWAY_SIGNING_SECRET:?GATEWAY_SIGNING_SECRET must be set in infra/.env}
      SAGA_FAIL_CREDIT: ${SAGA_FAIL_CREDIT}
      # End-of-day reconciliation: nightly schedule is opt-in; manual admin runs always work.
      RECON_ENABLED: ${RECON_ENABLED}
      RECON_CRON: ${RECON_CRON}
      TRANSFER_FEE_ENABLED: ${TRANSFER_FEE_ENABLED}
      TRANSFER_FEE_FLAT: ${TRANSFER_FEE_FLAT}
      TRANSFER_FEE_PERCENT: ${TRANSFER_FEE_PERCENT}
      TRANSFER_FEE_MIN: ${TRANSFER_FEE_MIN}
      TRANSFER_FEE_MAX: ${TRANSFER_FEE_MAX}
      # Must match account-service seed (FEE_INCOME_ACCOUNT_NUMBER). Values only from infra/.env.
      TRANSFER_FEE_INCOME_ACCOUNT: ${TRANSFER_FEE_INCOME_ACCOUNT:?TRANSFER_FEE_INCOME_ACCOUNT must be set in infra/.env}
      FEE_INCOME_ACCOUNT_NUMBER: ${FEE_INCOME_ACCOUNT_NUMBER:?FEE_INCOME_ACCOUNT_NUMBER must be set in infra/.env}
      # NAPAS: mock by default; set NAPAS_PROVIDER=http + NAPAS_BASE_URL for real/sandbox switch
      NAPAS_PROVIDER: ${NAPAS_PROVIDER:-mock}
      NAPAS_BASE_URL: ${NAPAS_BASE_URL}
      NAPAS_API_KEY: ${NAPAS_API_KEY}
      NAPAS_WEBHOOK_SECRET: ${NAPAS_WEBHOOK_SECRET:?NAPAS_WEBHOOK_SECRET must be set in infra/.env}
      NAPAS_WEBHOOK_MAX_CLOCK_SKEW_SECONDS: ${NAPAS_WEBHOOK_MAX_CLOCK_SKEW_SECONDS}
      NAPAS_CONNECT_TIMEOUT_MS: ${NAPAS_CONNECT_TIMEOUT_MS}
      NAPAS_REQUEST_TIMEOUT_MS: ${NAPAS_REQUEST_TIMEOUT_MS}
      NAPAS_STATUS_POLL_MS: ${NAPAS_STATUS_POLL_MS}
      NAPAS_STATUS_MIN_AGE_SECONDS: ${NAPAS_STATUS_MIN_AGE_SECONDS}
      NAPAS_STATUS_MAX_ATTEMPTS: ${NAPAS_STATUS_MAX_ATTEMPTS}
      NAPAS_READ_RETRY_MAX_ATTEMPTS: ${NAPAS_READ_RETRY_MAX_ATTEMPTS}
      NAPAS_READ_RETRY_WAIT_DURATION: ${NAPAS_READ_RETRY_WAIT_DURATION}
      NAPAS_CIRCUIT_BREAKER_WINDOW_SIZE: ${NAPAS_CIRCUIT_BREAKER_WINDOW_SIZE}
      NAPAS_CIRCUIT_BREAKER_MIN_CALLS: ${NAPAS_CIRCUIT_BREAKER_MIN_CALLS}
      NAPAS_CIRCUIT_BREAKER_FAILURE_RATE: ${NAPAS_CIRCUIT_BREAKER_FAILURE_RATE}
      NAPAS_CIRCUIT_BREAKER_OPEN_DURATION: ${NAPAS_CIRCUIT_BREAKER_OPEN_DURATION}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_CONTAINER_PORT}
      BENEFICIARY_CACHE_TTL_SECONDS: ${BENEFICIARY_CACHE_TTL_SECONDS:?BENEFICIARY_CACHE_TTL_SECONDS must be set in infra/.env}
      BANK_INQUIRY_PROVIDER: ${BANK_INQUIRY_PROVIDER:-mock}
      BANK_INQUIRY_TTL: ${BANK_INQUIRY_TTL:-5m}
      BANK_INQUIRY_EXTERNAL_BASE_URL: ${BANK_INQUIRY_EXTERNAL_BASE_URL:-https://api.vietqr.io}
      BANK_INQUIRY_EXTERNAL_CLIENT_ID: ${BANK_INQUIRY_EXTERNAL_CLIENT_ID}
      BANK_INQUIRY_EXTERNAL_API_KEY: ${BANK_INQUIRY_EXTERNAL_API_KEY}
      BANK_INQUIRY_TIMEOUT_MS: ${BANK_INQUIRY_TIMEOUT_MS:-3000}
      BANK_DIRECTORY_SYNC_URL: ${BANK_DIRECTORY_SYNC_URL:-https://api.vietqr.io/v2/banks}
      BANK_DIRECTORY_SYNC_CRON: ${BANK_DIRECTORY_SYNC_CRON:-0 0 0 * * *}
      BANK_ENCRYPTION_AES_KEY: ${BANK_ENCRYPTION_AES_KEY:?BANK_ENCRYPTION_AES_KEY must be set in infra/.env}
      BANK_ENCRYPTION_HMAC_KEY: ${BANK_ENCRYPTION_HMAC_KEY:?BANK_ENCRYPTION_HMAC_KEY must be set in infra/.env}
      FORENSICS_ENABLED: ${FORENSICS_ENABLED}
      FORENSICS_STORAGE_ENDPOINT: ${FORENSICS_STORAGE_ENDPOINT}
      FORENSICS_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      FORENSICS_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      FORENSICS_STORAGE_BUCKET: ${FORENSICS_STORAGE_BUCKET}
      FORENSICS_AI_ENABLED: ${FORENSICS_AI_ENABLED}
