  notification-service:
    build:
      context: ../backend
      dockerfile: notification-service/Dockerfile
    container_name: bank-notification
    environment:
      SERVER_PORT: ${NOTIFICATION_SERVICE_PORT}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_CONTAINER_PORT}
      DB_NAME: ${NOTIFICATION_DB_NAME}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env}
      EUREKA_URL: ${EUREKA_URL}
      GATEWAY_MAX_CLOCK_SKEW_SECONDS: ${GATEWAY_MAX_CLOCK_SKEW_SECONDS}
      TRACING_SAMPLE_PROBABILITY: ${TRACING_SAMPLE_PROBABILITY}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP}
      KAFKA_ENABLE_AUTO_COMMIT: ${KAFKA_ENABLE_AUTO_COMMIT}
      KAFKA_TOPIC_COMPLETED: ${KAFKA_TOPIC_COMPLETED}
      KAFKA_TOPIC_FAILED: ${KAFKA_TOPIC_FAILED}

      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      NOTIFICATION_INTERNAL_API_KEY: ${NOTIFICATION_INTERNAL_API_KEY:?NOTIFICATION_INTERNAL_API_KEY must be set in infra/.env}
      BANK_CUSTOMER_INTERNAL_API_KEY: ${CUSTOMER_INTERNAL_API_KEY}
      BANK_CUSTOMER_SERVICE_URL: ${CUSTOMER_SERVICE_URL}
      GATEWAY_SIGNING_SECRET: ${GATEWAY_SIGNING_SECRET:?GATEWAY_SIGNING_SECRET must be set in infra/.env}
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT}
      # Email: mock by default; set EMAIL_PROVIDER=smtp + SMTP_* in infra/.env for real mail
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_STARTTLS: ${SMTP_STARTTLS}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: ${SMTP_CONNECT_TIMEOUT_MS}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: ${SMTP_READ_TIMEOUT_MS}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: ${SMTP_WRITE_TIMEOUT_MS}
      # Disable SMTP probe when using mock/no credentials (Spring Boot MailHealthIndicator)
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED}
      # SMS: mock by default; set SMS_PROVIDER=http + SMS_BASE_URL for real gateway
      SMS_PROVIDER: ${SMS_PROVIDER}
      SMS_BASE_URL: ${SMS_BASE_URL}
      SMS_API_KEY: ${SMS_API_KEY}
      SMS_FROM: ${SMS_FROM}
      SMS_CONNECT_TIMEOUT: ${SMS_CONNECT_TIMEOUT}
      SMS_READ_TIMEOUT: ${SMS_READ_TIMEOUT}
      RESILIENCE4J_RETRY_INSTANCES_SMTP_MAXATTEMPTS: ${NOTIFICATION_RETRY_MAX_ATTEMPTS}
      RESILIENCE4J_RETRY_INSTANCES_SMTP_WAITDURATION: ${NOTIFICATION_RETRY_WAIT_DURATION}
      RESILIENCE4J_RETRY_INSTANCES_SMS_MAXATTEMPTS: ${NOTIFICATION_RETRY_MAX_ATTEMPTS}
      RESILIENCE4J_RETRY_INSTANCES_SMS_WAITDURATION: ${NOTIFICATION_RETRY_WAIT_DURATION}
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_SMTP_SLIDINGWINDOWSIZE: ${NOTIFICATION_CIRCUIT_BREAKER_WINDOW_SIZE}
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_SMTP_MINIMUMNUMBEROFCALLS: ${NOTIFICATION_CIRCUIT_BREAKER_MIN_CALLS}
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_SMTP_FAILURERATETHRESHOLD: ${NOTIFICATION_CIRCUIT_BREAKER_FAILURE_RATE}
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_SMTP_WAITDURATIONINOPENSTATE: ${NOTIFICATION_CIRCUIT_BREAKER_OPEN_DURATION}
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_SMS_SLIDINGWINDOWSIZE: ${NOTIFICATION_CIRCUIT_BREAKER_WINDOW_SIZE}
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_SMS_MINIMUMNUMBEROFCALLS: ${NOTIFICATION_CIRCUIT_BREAKER_MIN_CALLS}
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_SMS_FAILURERATETHRESHOLD: ${NOTIFICATION_CIRCUIT_BREAKER_FAILURE_RATE}
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_SMS_WAITDURATIONINOPENSTATE: ${NOTIFICATION_CIRCUIT_BREAKER_OPEN_DURATION}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${NOTIFICATION_SERVICE_PORT}/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 70s
    networks:
      - bank-net

  corporate-service:
    build:
