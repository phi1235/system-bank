      FORENSICS_REPLAY_EXECUTION_IMAGE_SHA: ${FORENSICS_REPLAY_EXECUTION_IMAGE_SHA}
      FORENSICS_EXPORT_RETENTION: ${FORENSICS_EXPORT_RETENTION}
